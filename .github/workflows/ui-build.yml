name: MARCAS UI build

on:
  push:
    branches: [update-requerimientos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check administrative sidebar routes
        run: node scripts/check-admin-sidebar.mjs
      - name: Check user registration
        run: node scripts/check-user-registration.mjs
      - name: Check login contracts
        run: node scripts/check-login.mjs
      - name: Check order filters
        run: node scripts/check-order-filters.mjs
      - name: Check product registration structure
        run: node scripts/check-create-product.mjs
      - name: Check category management
        run: node scripts/check-categories.mjs
      - name: Check provider management
        run: node scripts/check-providers.mjs
      - name: Check product catalog
        run: node scripts/check-product-catalog.mjs
      - name: Check shared data table layout
        run: node scripts/check-app-data-table-layout.mjs
      - name: Check customer registration
        run: node scripts/check-create-customer.mjs
      - name: Check customer directory
        run: node scripts/check-customer-directory.mjs
      - name: Check prospect workflow
        run: node scripts/check-prospect-workflow.mjs
      - name: Check prospect history
        run: node scripts/check-prospect-history.mjs
      - name: Check visit workflow
        run: node scripts/check-visit-workflow.mjs
      - name: Check visit history
        run: node scripts/check-visit-history.mjs
      - name: TypeScript and Vite build
        run: npm run build
