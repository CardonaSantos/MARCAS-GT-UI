name: MARCAS UI build

on:
  push:
    branches: [update-requerimientos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check administrative sidebar routes
        run: node scripts/check-admin-sidebar.mjs
      - name: Check user registration
        run: node scripts/check-user-registration.mjs
      - name: Check login contracts
        run: node scripts/check-login.mjs
      - name: TypeScript and Vite build
        run: npm run build
