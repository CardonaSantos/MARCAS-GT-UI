name: Transporte GPS - UI Build
on:
  push:
    branches: [feat-gps-transporte-20261009]
  pull_request:
    branches: [update-requerimientos]
    paths:
      - "src/Pages/Transporte/**"
      - "src/features/common/utils/geolocation.ts"
      - "src/features/entregas/common/delivery-geolocation.ts"
      - ".github/workflows/transporte-gps-ui-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
