name: Créditos flujo directo UI CI
on:
  push:
    branches: [feat-creditos-flujo-directo-ui-20261009]
  pull_request:
    branches: [update-requerimientos]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
